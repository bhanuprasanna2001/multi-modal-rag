[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-modal-rag"
version = "0.3.0"
description = "Multi-modal RAG for technical datasheets — hybrid search (BM25 + dense) with OpenAI embeddings/captioning/generation"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mmrag*"]

[project.scripts]
mmrag-build = "mmrag.cli:build"
mmrag-query = "mmrag.cli:query"

[tool.pytest.ini_options]
pythonpath = ["src"]
